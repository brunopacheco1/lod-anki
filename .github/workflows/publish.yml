name: Publish to npm

on:
  release:
    types: [published]
  # Retries a release: run it on the release tag (e.g. v2.0.0), not on a branch.
  workflow_dispatch:

permissions:
  contents: read
  id-token: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the release tag matches package.json
        env:
          TAG: ${{ github.event.release.tag_name || github.ref_name }}
          REF_TYPE: ${{ github.ref_type }}
        run: |
          if [ "$REF_TYPE" != "tag" ]; then
            echo "Only release tags are published; run this workflow on a tag such as v2.0.0"
            exit 1
          fi
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Release tag $TAG does not match package.json $VERSION"
            exit 1
          fi
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      # Uses npm trusted publishing (OIDC): no NPM_TOKEN secret needed once the
      # trusted publisher is configured on npmjs.com for this workflow file.
      # The version is only staged: a maintainer approves it with 2FA on npmjs.com
      # (or `npm stage approve <id>`) before it goes live.
      - run: npm stage publish --provenance --access public
