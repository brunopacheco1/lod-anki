name: Publish to npm

on:
  # Release button: Actions > Publish to npm > Run workflow. It releases the version in package.json on main.
  workflow_dispatch:
  # A release published by hand on GitHub (tag vX.Y.Z matching package.json) also publishes.
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch' && github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v7
      - name: Tag and release the version in package.json
        id: release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="v$(node -p "require('./package.json').version")"
          if gh release view "$TAG" >/dev/null 2>&1 || git ls-remote --exit-code --tags origin "refs/tags/$TAG" >/dev/null; then
            echo "::error::$TAG is already released. Bump the version in package.json first (npm version patch|minor|major --no-git-tag-version)."
            exit 1
          fi
          gh release create "$TAG" --title "$TAG" --generate-notes --target "$GITHUB_SHA"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"

  publish:
    needs: release
    if: always() && (github.event_name == 'release' || needs.release.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-node@v7
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the release tag matches package.json
        env:
          TAG: ${{ needs.release.outputs.tag || github.event.release.tag_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Release tag $TAG does not match package.json $VERSION"
            exit 1
          fi
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      # Uses npm trusted publishing (OIDC) for this workflow file, so no NPM_TOKEN secret.
      # The version is only staged: a maintainer approves it with 2FA on npmjs.com
      # (or `npm stage approve <id>`) before it goes live.
      - run: npm stage publish --provenance --access public
