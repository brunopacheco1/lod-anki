name: Publish to npm

on:
  # Release button: Actions > Publish to npm > Run workflow, then pick major, minor or patch.
  workflow_dispatch:
    inputs:
      bump:
        description: Which part of the version to increase
        type: choice
        options: [patch, minor, major]
        default: patch
  # A release published by hand on GitHub (tag vX.Y.Z matching package.json) also publishes.
  release:
    types: [published]

permissions:
  contents: read

concurrency:
  group: publish
  cancel-in-progress: false

jobs:
  release:
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    outputs:
      tag: ${{ steps.release.outputs.tag }}
    steps:
      - uses: actions/checkout@v5
        with:
          ref: main
          fetch-depth: 0
      - uses: actions/setup-node@v5
        with:
          node-version: 24
      - name: Tag and release the next version
        id: release
        env:
          BUMP: ${{ inputs.bump }}
          GH_TOKEN: ${{ github.token }}
        run: |
          LAST=$(git tag --list 'v[0-9]*.[0-9]*.[0-9]*' --sort=-v:refname | head -1)
          NEXT=$(node -e '
            const [major, minor, patch] = process.argv[1].split(".").map(Number);
            const bump = process.argv[2];
            console.log(bump === "major" ? `${major + 1}.0.0` : bump === "minor" ? `${major}.${minor + 1}.0` : `${major}.${minor}.${patch + 1}`);
          ' "${LAST#v}" "$BUMP")
          echo "Releasing v$NEXT (previous release ${LAST:-none})"

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          npm version "$NEXT" --no-git-tag-version --allow-same-version
          if ! git diff --quiet; then
            git commit -am "Release v$NEXT"
          fi
          git tag "v$NEXT"
          git push origin HEAD:main "v$NEXT"
          gh release create "v$NEXT" --title "v$NEXT" --generate-notes --verify-tag
          echo "tag=v$NEXT" >> "$GITHUB_OUTPUT"

  publish:
    needs: release
    if: always() && (github.event_name == 'release' || needs.release.result == 'success')
    runs-on: ubuntu-latest
    permissions:
      contents: read
      id-token: write
    steps:
      - uses: actions/checkout@v5
        with:
          ref: ${{ needs.release.outputs.tag || github.event.release.tag_name }}
      - uses: actions/setup-node@v5
        with:
          node-version: 24
          registry-url: https://registry.npmjs.org
      - name: Check the release tag matches package.json
        env:
          TAG: ${{ needs.release.outputs.tag || github.event.release.tag_name }}
        run: |
          VERSION="v$(node -p "require('./package.json').version")"
          if [ "$VERSION" != "$TAG" ]; then
            echo "Release tag $TAG does not match package.json $VERSION"
            exit 1
          fi
      - run: npm install -g npm@latest
      - run: npm ci
      - run: npm run build
      # Uses npm trusted publishing (OIDC) for this workflow file, so no NPM_TOKEN secret.
      # The version is only staged: a maintainer approves it with 2FA on npmjs.com
      # (or `npm stage approve <id>`) before it goes live.
      - run: npm stage publish --provenance --access public
