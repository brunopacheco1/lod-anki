name: LOD data

on:
  workflow_dispatch:
  push:
    branches: [claude/project-thread-y2iga6]
    paths: [.github/workflows/lod-data.yml, scripts/inspect-lod.py]

jobs:
  inspect:
    runs-on: ubuntu-latest
    steps:
      - name: Find the latest LOD linguistic dataset
        id: latest
        run: |
          curl -sSf https://data.public.lu/api/1/datasets/letzebuerger-online-dictionnaire-lod-linguistesch-daten/ > dataset.json
          jq -r '.resources[] | [.last_modified, .title, .url] | @tsv' dataset.json | sort -r | head -5
          URL=$(jq -r '[.resources[] | select(.title | test("new-lod-art"))] | sort_by(.last_modified) | last | .url' dataset.json)
          echo "url=$URL" >> "$GITHUB_OUTPUT"
      - name: Download and unpack
        run: |
          curl -sSfL -o lod.zip "${{ steps.latest.outputs.url }}"
          mkdir lod && unzip -q lod.zip -d lod
          find lod -maxdepth 2 | head -10
          echo "files: $(find lod -type f | wc -l)"
          du -sh lod
      - uses: actions/checkout@v4
        with:
          path: repo
      - name: Print sample entries
        run: python3 repo/scripts/inspect-lod.py lod/new_lod-art.xml "Moien,Haus,goen,schéin,an,well,gär,Äddi,Auto,ech,ginn,sinn,hunn,Fra,Kand,séier,mat,awer,ouni,lafen,Bam"
      - uses: actions/upload-artifact@v4
        with:
          name: lod-dataset
          path: lod.zip
