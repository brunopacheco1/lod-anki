name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node: [22, 24]
    steps:
      - uses: actions/checkout@v7
      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node }}
      - run: npm ci
      - run: npm run build
      - run: npm test
      - name: Smoke test the packed CLI from a clean folder
        run: |
          npm pack --pack-destination "$RUNNER_TEMP"
          mkdir "$RUNNER_TEMP/smoke" && cd "$RUNNER_TEMP/smoke"
          npm init -y > /dev/null
          npm install "$RUNNER_TEMP"/lod-anki-*.tgz
          npx lod-anki --help
          echo '{"name":"Smoke","fileName":"smoke","types":[],"languages":["EN"],"flashcards":["Kand","basic:Moien;Hello"]}' > deck.json
          LOD_ANKI_CACHE="$RUNNER_TEMP/cache" npx lod-anki export deck.json
          test -s smoke_english.apkg
          printf 'Kand\nbasic:Moien;Hello\n' > words.txt
          LOD_ANKI_CACHE="$RUNNER_TEMP/cache" npx lod-anki export words.txt --languages EN,FR
          test -s words_english.apkg && test -s words_francais.apkg
